name: Windows portable review
on:
  workflow_dispatch:
  push:
    branches: [codex/distribution-review]
permissions:
  contents: read
jobs:
  clean-windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.9'
          architecture: x64
      - name: Install reviewed Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Bootstrap and check exact Windows SDK
        run: python -m tools.setup_windows --download-sdk
      - name: Build clean application source
        run: python -m tools.build_native
      - name: Check source privacy and links
        run: |
          python -m tools.check_privacy
          python -m tools.check_links
      - name: Backend validation without live inference
        run: python -m tools.validate
      - name: Create and relocate portable review candidate
        run: python -m tools.package_native --output release-staging/review-0.5.0 --smoke-test
      - name: Verify final archive inventory and checksum
        run: python -m tools.verify_archive release-staging/PromptToCAD-0.5.0-windows-x64.zip
      - name: Smoke test the extracted ZIP
        run: python -m tools.smoke_package release-staging/PromptToCAD-0.5.0-windows-x64.zip
      - name: Retain reviewed artifacts (not a public release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PromptToCAD-windows-x64-review
          path: |
            release-staging/*.zip
            release-staging/*.sha256
            artifacts/release-checks/*.json
          if-no-files-found: error
          retention-days: 14
