name: Windows source check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
          architecture: x64
      - name: Create Python environment
        run: python -m venv .venv
      - name: Install Python dependencies
        run: .venv\Scripts\python.exe -m pip install -r requirements-dev.txt
      - name: Set up pinned Qt and OpenCascade SDKs
        run: .venv\Scripts\python.exe -m tools.setup_windows --download-sdk
      - name: Build source application
        run: .venv\Scripts\python.exe -m tools.build_native
      - name: Check tracked source privacy
        run: .venv\Scripts\python.exe -m tools.check_privacy
      - name: Check documentation links
        run: .venv\Scripts\python.exe -m tools.check_links
      - name: Enable pinned software OpenGL for the CI viewport
        run: Copy-Item -LiteralPath .sdk\windows\Library\bin\opengl32sw.dll -Destination build\bin\opengl32.dll
      - name: Launch from outside the checkout and exercise the native viewport
        env:
          QT_OPENGL: software
        run: .venv\Scripts\python.exe -m tools.validate_ui --case laptop-solid --launcher
      - name: Validate backend and portable launcher
        run: .venv\Scripts\python.exe -m tools.validate
